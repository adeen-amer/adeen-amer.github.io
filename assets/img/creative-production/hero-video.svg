<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="video-title video-desc">
  <title id="video-title">Video timeline diagram</title>
  <desc id="video-desc">Diagram of a video edit timeline with video and audio tracks, plus a tone curve representing color grading applied after the cut is locked.</desc>
  <style>
    .spec-eyebrow { font: 600 15px "Inter", system-ui, -apple-system, sans-serif; letter-spacing: 0.04em; fill: #404040; }
    .spec-title { font: 700 22px "Inter", system-ui, -apple-system, sans-serif; fill: #0a0a0a; }
    .track-label { font: 600 13px "Inter", system-ui, -apple-system, sans-serif; fill: #737373; }
    .spec-note-muted { font: 400 13px "Inter", system-ui, -apple-system, sans-serif; fill: #737373; }
  </style>

  <rect x="0" y="0" width="800" height="500" fill="#ffffff" />

  <text x="40" y="46" class="spec-eyebrow">PRODUCTION SPEC · VIDEO</text>
  <text x="40" y="72" class="spec-title">Timeline discipline before grading</text>

  <!-- video track with clips -->
  <text x="40" y="112" class="track-label">V1</text>
  <rect x="120" y="94" width="640" height="34" fill="#f5f5f5" />
  <rect x="122" y="96" width="110" height="30" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />
  <rect x="234" y="96" width="160" height="30" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />
  <rect x="396" y="96" width="90" height="30" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />
  <rect x="488" y="96" width="200" height="30" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />
  <rect x="690" y="96" width="68" height="30" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />

  <!-- audio tracks -->
  <text x="40" y="152" class="track-label">A1</text>
  <rect x="120" y="136" width="640" height="24" fill="#f5f5f5" />
  <polyline points="128,148 145,142 162,152 179,144 196,150 213,140 230,153 247,145 264,149 281,141 298,151 315,146 332,149 349,142 366,150 383,147 400,151 417,144 434,149 451,143 468,150 485,146 502,151 519,144 536,149 553,147 570,150 587,143 604,149 621,146 638,151 655,144 672,148"
    fill="none" stroke="#262626" stroke-width="1.5" />

  <text x="40" y="188" class="track-label">A2</text>
  <rect x="120" y="172" width="640" height="24" fill="#f5f5f5" />
  <g fill="#a3a3a3">
    <rect x="500" y="176" width="4" height="16" /><rect x="508" y="178" width="4" height="12" /><rect x="516" y="175" width="4" height="18" /><rect x="524" y="180" width="4" height="8" /><rect x="532" y="177" width="4" height="14" /><rect x="540" y="176" width="4" height="16" /><rect x="548" y="178" width="4" height="12" /><rect x="556" y="175" width="4" height="18" /><rect x="564" y="180" width="4" height="8" /><rect x="572" y="177" width="4" height="14" />
  </g>

  <line x1="120" y1="94" x2="120" y2="196" stroke="#d4d4d4" stroke-width="1" />
  <line x1="410" y1="94" x2="410" y2="212" stroke="#0a0a0a" stroke-width="1.5" />
  <text x="420" y="210" font="600 12px 'Inter', system-ui, sans-serif" fill="#0a0a0a">LOCKED CUT</text>

  <!-- tone curve card, drawn after cut is locked -->
  <rect x="560" y="240" width="200" height="180" rx="10" fill="#fafafa" stroke="#0a0a0a" stroke-width="2" />
  <text x="580" y="266" font="600 12px 'Inter', system-ui, sans-serif" fill="#404040" letter-spacing="0.03em">TONE CURVE</text>
  <line x1="580" y1="390" x2="740" y2="390" stroke="#d4d4d4" stroke-width="1" />
  <line x1="580" y1="290" x2="580" y2="390" stroke="#d4d4d4" stroke-width="1" />
  <line x1="580" y1="390" x2="740" y2="290" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="2 3" />
  <path d="M580,390 C 620,388, 640,340, 680,310 C 700,296, 720,292, 740,290" fill="none" stroke="#0a0a0a" stroke-width="2.5" />

  <line x1="560" y1="300" x2="470" y2="230" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="4 4" />

  <text x="40" y="270" font="600 15px 'Inter', system-ui, sans-serif" fill="#262626">Pacing beats plug-ins</text>
  <text x="40" y="294" class="spec-note-muted">The cut is locked — pacing, coverage and</text>
  <text x="40" y="314" class="spec-note-muted">sound design settled — before any grade</text>
  <text x="40" y="334" class="spec-note-muted">touches the timeline.</text>

  <text x="40" y="480" class="spec-note-muted">Illustrative — not a screenshot of any specific editor.</text>
</svg>
