# Signalcast niche pack: AI governance & regulation
#
# Audience: product managers, compliance leads, and founders at companies
# shipping AI features who need to know when the rules change — but who are not
# going to read EUR-Lex on a Monday morning.
#
# Sources are official RSS/Atom feeds. No scraping, no login walls, no ToS grey
# area — this is the reason this pack is the default. Feeds move slowly and
# break rarely.

slug: ai-governance
name: "AI Governance Weekly"
timezone: "Asia/Dubai"

audience: >
  Product managers, compliance leads, and founders at companies that ship
  AI-powered features. They are commercially minded, not lawyers. They care
  about what changes for their roadmap, their contracts, and their risk
  posture — not about legal theory.

sources:
  - name: "European Commission — Digital strategy news"
    url: "https://digital-strategy.ec.europa.eu/en/rss.xml"
    kind: rss
    context: "EU policy announcements, including AI Act implementation and guidance."

  - name: "NIST — Cybersecurity & AI news"
    url: "https://www.nist.gov/news-events/news/rss.xml"
    kind: rss
    context: "US standards body. AI Risk Management Framework updates appear here."

  - name: "UK ICO — News and blogs"
    url: "https://ico.org.uk/rss/news-and-blogs/"
    kind: rss
    context: "UK data protection regulator. Enforcement actions and AI guidance."

  - name: "US FTC — Press releases"
    url: "https://www.ftc.gov/feeds/press-release.xml"
    kind: rss
    context: "US consumer protection enforcement, including AI claims and dark patterns."

  - name: "OECD.AI — Policy news"
    url: "https://oecd.ai/en/rss/news"
    kind: rss
    context: "International AI policy coordination and national strategy announcements."

relevance:
  # Fed to the scoring model as positive signal.
  include:
    - "New or amended law, regulation, or binding guidance affecting AI systems"
    - "Enforcement action, fine, or investigation involving an AI product"
    - "Compliance deadlines and transition periods with concrete dates"
    - "Official guidance that changes what a product team must document or disclose"
    - "Standards or certification schemes that customers will start asking about"
  # Fed to the scoring model as negative signal.
  exclude:
    - "Conference announcements, webinars, and calls for papers"
    - "Job postings and staff appointments"
    - "Opinion pieces with no new factual development"
    - "Pure research results with no regulatory or commercial consequence"
    - "Anything with no clear action or implication for a product team"

digest:
  # Monday 06:00 in the timezone above.
  cron: "0 6 * * 1"
  max_items: 10
  # Items below this score are dropped even if marked relevant.
  min_score: 55
  subject: "AI Governance Weekly — {{date}}"
  intro: >
    Everything that changed for AI product teams this week, with the
    so-what spelled out. Five-minute read.

pricing:
  monthly_usd: 29
  currency: usd
  trial_days: 0
