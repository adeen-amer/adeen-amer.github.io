<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="mkt-title mkt-desc">
  <title id="mkt-title">Marketplace listing flow diagram</title>
  <desc id="mkt-desc">Process diagram of a marketplace listing flow — draft, fees and verification shown upfront, review, publish — with a dispute path after publish.</desc>
  <style>
    .spec-eyebrow { font: 600 20px "Inter", system-ui, -apple-system, sans-serif; letter-spacing: 0.04em; fill: #404040; }
    .spec-title { font: 700 30px "Inter", system-ui, -apple-system, sans-serif; fill: #0a0a0a; }
    .spec-note { font: 400 19px "Inter", system-ui, -apple-system, sans-serif; fill: #262626; }
    .spec-note-muted { font: 400 17px "Inter", system-ui, -apple-system, sans-serif; fill: #737373; }
    .spec-num { font: 700 17px "Inter", system-ui, -apple-system, sans-serif; fill: #fafafa; }
    .step-label { font: 600 17px "Inter", system-ui, -apple-system, sans-serif; fill: #262626; text-anchor: middle; }
    .chip-label { font: 600 14px "Inter", system-ui, -apple-system, sans-serif; fill: #262626; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="1200" height="750" fill="#ffffff" />

  <text x="64" y="66" class="spec-eyebrow">PROCESS SPEC · MARKETPLACE</text>
  <text x="64" y="100" class="spec-title">Listing flow — fees shown upfront</text>

  <!-- stepper -->
  <line x1="140" y1="200" x2="1060" y2="200" stroke="#d4d4d4" stroke-width="2" />

  <circle cx="140" cy="200" r="22" fill="#0a0a0a" />
  <text x="140" y="207" class="spec-num" text-anchor="middle" font-size="19">1</text>
  <text x="140" y="248" class="step-label">Draft</text>

  <circle cx="420" cy="200" r="22" fill="#0a0a0a" />
  <text x="420" y="207" class="spec-num" text-anchor="middle" font-size="19">2</text>
  <text x="420" y="248" class="step-label">Fees &amp; verification</text>

  <circle cx="700" cy="200" r="22" fill="none" stroke="#0a0a0a" stroke-width="2.5" />
  <text x="700" y="207" fill="#0a0a0a" font="700 17px 'Inter', system-ui, sans-serif" text-anchor="middle">3</text>
  <text x="700" y="248" class="step-label">Review</text>

  <circle cx="980" cy="200" r="22" fill="none" stroke="#0a0a0a" stroke-width="2.5" />
  <text x="980" y="207" fill="#0a0a0a" font="700 17px 'Inter', system-ui, sans-serif" text-anchor="middle">4</text>
  <text x="980" y="248" class="step-label">Published</text>

  <!-- fee card under step 2 -->
  <rect x="320" y="290" width="200" height="150" rx="12" fill="#fafafa" stroke="#0a0a0a" stroke-width="2" />
  <text x="340" y="316" font="600 14px 'Inter', system-ui, sans-serif" fill="#404040" letter-spacing="0.03em">FEE BREAKDOWN</text>
  <line x1="340" y1="326" x2="500" y2="326" stroke="#d4d4d4" stroke-width="1" />
  <rect x="340" y="340" width="120" height="9" rx="4.5" fill="#262626" />
  <rect x="460" y="340" width="40" height="9" rx="4.5" fill="#737373" />
  <rect x="340" y="364" width="90" height="9" rx="4.5" fill="#262626" />
  <rect x="460" y="364" width="40" height="9" rx="4.5" fill="#737373" />
  <rect x="340" y="388" width="105" height="9" rx="4.5" fill="#262626" />
  <rect x="460" y="388" width="40" height="9" rx="4.5" fill="#737373" />
  <line x1="340" y1="406" x2="500" y2="406" stroke="#0a0a0a" stroke-width="1.5" />
  <rect x="340" y="416" width="60" height="10" rx="5" fill="#0a0a0a" />
  <rect x="460" y="416" width="40" height="10" rx="5" fill="#0a0a0a" />

  <!-- dispute path branch after publish -->
  <path d="M980 222 L980 470 L860 470" fill="none" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="4 4" />
  <rect x="700" y="450" width="160" height="40" rx="20" fill="#f5f5f5" stroke="#d4d4d4" stroke-width="1" />
  <text x="780" y="475" class="chip-label">Dispute path</text>

  <!-- category chips -->
  <rect x="140" y="450" width="90" height="34" rx="17" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />
  <text x="185" y="472" class="chip-label" font-size="13">OLX</text>
  <rect x="240" y="450" width="120" height="34" rx="17" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />
  <text x="300" y="472" class="chip-label" font-size="13">Zameen.com</text>
  <rect x="370" y="450" width="150" height="34" rx="17" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5" />
  <text x="445" y="472" class="chip-label" font-size="13">Dubizzle Cars</text>

  <!-- annotations -->
  <line x1="320" y1="365" x2="180" y2="330" stroke="#a3a3a3" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="166" cy="316" r="15" fill="#0a0a0a" />
  <text x="166" y="321" class="spec-num" text-anchor="middle">1</text>
  <text x="64" y="560" class="spec-note" font-weight="600">① Fees before commit</text>
  <text x="64" y="584" class="spec-note-muted">Verification and category fees surface at</text>
  <text x="64" y="606" class="spec-note-muted">step two — no post-submit surprises.</text>

  <text x="64" y="646" class="spec-note" font-weight="600">② Policy pack per category</text>
  <text x="64" y="670" class="spec-note-muted">Each vertical carries its own decision-tree</text>
  <text x="64" y="692" class="spec-note-muted">template, reused across squads.</text>

  <text x="620" y="560" class="spec-note" font-weight="600">③ Dispute path stays close</text>
  <text x="620" y="584" class="spec-note-muted">Post-publish issues route back in one step,</text>
  <text x="620" y="606" class="spec-note-muted">not buried behind a support ticket.</text>

  <text x="620" y="646" class="spec-note-muted">Illustrative process diagram — proprietary</text>
  <text x="620" y="668" class="spec-note-muted">product UI not shown.</text>
</svg>
